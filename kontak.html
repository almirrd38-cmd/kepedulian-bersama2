<!DOCTYPE html>
<html>
    <head>
        <title>Kontak</title>
        <style>
  body {
    font-family: Arial, sans-serif; /* Ganti font biar rapi */
    max-width: 700px; /* Batasi lebar teks biar ga melebar ke pinggir */
    margin: 0 auto;   /* Bikin teks otomatis ke tengah */
    padding: 20px;    /* Kasih jarak dari pinggir layar */
    line-height: 1.5; /* Jarak antar baris biar enak dibaca */
  }
  h1, h2 {
    color: #2e7d32;   /* Warna hijau */
    text-align: center; /* Judul ke tengah */
  }
  p {
    text-align: justify; /* Teks paragraf rata kanan-kiri */
  }
  hr {
    border: 0;
    border-top: 1px solid #ccc; /* Garis pemisah */
    margin: 20px 0;
  }
</style>
    </head>
    <body>
        <div>
            <h1 style="text-align:center; color:rgb(0, 114, 44)">Hubungi kami melalui di bawah ini</h1>
                    <div class="card" id="kontak">
            <section class="contact-section">
                <h2>Contact Me</h2>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="alamat email" required>
                    </div>
                    <div class="form-group">
                        <label for="pesan">Pesan</label>
                        <textarea id="pesan" name="pesan" rows="5" placeholder="Tulis pesan anda..." required></textarea>
                    </div>
                    <button type="submit">Kirim</button>
                </form>
            </section>
        </div>

    </div>
        </div>
    </body>
